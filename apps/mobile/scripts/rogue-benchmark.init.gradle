// Opt-in isolated benchmark APK. The normal Android build is unaffected.
allprojects {
    afterEvaluate { project ->
        if (project.path == ':app') {
            project.android.defaultConfig.applicationId = 'com.shortest.roguebenchmark'
            project.extensions.getByName('react').entryFile.set(new File(project.projectDir, '../../scripts/rogue-benchmark.tsx'))
        }
    }
}
